<!DOCTYPE html>
<html>
    <head>
        <title>View {{ title }}</title>
        <style>
            body {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                font-family: 'Courier New', Courier, monospace;
            }
        </style>
    </head>
    <body>
        {% if exists %}
        <div class="video">
            <!-- Video Container -->
             <video width="860" height="485" autoplay>
                <source src="/video/{{ id }}.mp4" type="video/mp4">
             </video>
        </div>
        {% else %}
        <div class="novideo">
            <p>No video!</p>
        </div>
        {% endif %}
        <div class="data">
            <!-- Data Container -->
            <table>
                <tr>
                    <th>Lux</th>
                    <th>Temperature</th>
                    <th>Humidity</th>
                </tr>
                <tr>
                    <td>{{ data[0] }}</td>
                    <td>{{ data[1] }}</td>
                    <td>{{ data[2] }}</td>
                </tr>
            </table>
        </div>
    </body>
</html>
