[project]
name = "server"
version = "0.1.0"
description = "Server-side software for Birdhouse"
authors = [
    { name = "Lawson Conallin", email = "lawson.conallin@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
    "djangorestframework>=3.18.1",
    "huey>=3.4.0",
]

[project.scripts]
server = "server:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
